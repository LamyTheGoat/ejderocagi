services:
  - type: web
    name: ejder-ocagi-online
    runtime: node
    plan: starter
    buildCommand: "npm ci --omit=dev"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_URL
        sync: false
      - key: NODE_ENV
        value: production
    disk:
      name: ejder-ocagi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
